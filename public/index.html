<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job board</title>
    <style>
      :root {
        --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --border-color: #e2e8f0;
        --text-color: #1e293b;
        --text-muted: #64748b;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --danger: #dc2626;
        --danger-hover: #b91c1c;
      }
      body {
        font-family: var(--font-sans);
        margin: 0 auto;
        max-width: 680px;
        padding: 24px 16px;
        color: var(--text-color);
        background: #f8fafc;
        line-height: 1.5;
      }
      h1 { margin: 0 0 16px; font-size: 1.75rem; }
      h2 {
        margin: 36px 0 16px;
        font-size: 1.25rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .count-badge {
        font-size: 0.85rem;
        font-weight: 600;
        background: #e2e8f0;
        color: #334155;
        padding: 2px 10px;
        border-radius: 9999px;
      }
      input {
        font-size: 16px;
        padding: 10px 14px;
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #ffffff;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }
      ul { padding: 0; margin: 0; }
      li {
        background: #ffffff;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        list-style: none;
        margin: 10px 0;
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .job-details { flex: 1; }
      .btn {
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid transparent;
        cursor: pointer;
        transition: background-color 0.15s, color 0.15s, border-color 0.15s;
        white-space: nowrap;
      }
      .btn-save {
        background: var(--primary);
        color: #ffffff;
      }
      .btn-save:hover { background: var(--primary-hover); }
      .btn-saved {
        background: #f1f5f9;
        color: #475569;
        border-color: #cbd5e1;
        cursor: default;
      }
      .btn-remove {
        background: #ffffff;
        color: var(--danger);
        border-color: #fca5a5;
      }
      .btn-remove:hover {
        background: #fef2f2;
        border-color: var(--danger);
      }
      .empty-notice {
        color: var(--text-muted);
        font-style: italic;
        padding: 8px 0;
        margin: 0;
      }
      .error-banner {
        background: #fef2f2;
        color: #991b1b;
        border: 1px solid #fecaca;
        border-radius: 6px;
        padding: 8px 12px;
        margin-bottom: 16px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Jobs</h1>
    <div id="error-banner" class="error-banner" style="display: none;"></div>
    <input id="search" placeholder="Search by title, company or place" />
    <ul id="jobs"></ul>

    <h2>
      <span>Saved jobs</span>
      <span id="saved-count" class="count-badge">0</span>
    </h2>
    <p id="saved-empty" class="empty-notice">No saved jobs yet.</p>
    <ul id="saved-jobs"></ul>

    <script type="module" src="/app.js"></script>
  </body>
</html>
